[project]
name = "omnirun"
version = "0.1.0"
description = "Hugging Face model preflight: can this machine run it, and how fast?"
readme = "README.md"
requires-python = ">=3.11,<3.14"
license = { text = "MIT" }
authors = [{ name = "OmniRun" }]
dependencies = [
  "fastapi>=0.115,<1.0",
  "httpx>=0.27,<1.0",
  "huggingface-hub>=0.25,<3.0",
  "pydantic>=2.8,<3.0",
  "pydantic-settings>=2.4,<3.0",
  "psutil>=6.0,<8.0",
  "PyYAML>=6.0,<7.0",
  "uvicorn>=0.30,<1.0",
]

[project.optional-dependencies]
helper = ["numpy>=1.26,<3.0"]

[dependency-groups]
dev = [
  "numpy>=1.26,<3.0",
  "pytest>=8.0,<10.0",
  "pytest-asyncio>=0.24,<2.0",
  "ruff>=0.6,<1.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["core", "api"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
asyncio_default_test_loop_scope = "function"
addopts = "-ra"
filterwarnings = ["error::DeprecationWarning"]

[tool.ruff]
target-version = "py311"
line-length = 100
extend-exclude = ["tests/fixtures"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "RUF"]
ignore = ["RUF001", "RUF002", "RUF003"]

[tool.uv]
default-groups = ["dev"]
