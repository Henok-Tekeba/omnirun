# These are vendor-published peak memory bandwidths, not measurements. The API
# labels manual profiles MEDIUM confidence and never treats them as verified.
# Memory sizes are GiB (2^30 bytes); bandwidth is decimal GB/s (10^9 bytes/s),
# matching how vendors publish it.
#
# v1 is single-device: pick one GPU/chip. Multi-GPU is out of scope.
