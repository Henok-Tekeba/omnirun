<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="robots" content="noindex" />
    <title>Page not found — OmniRun</title>
    <style>
      :root { color-scheme: light; }
      * { box-sizing: border-box; }
      body {
        min-height: 100svh;
        margin: 0;
        display: grid;
        place-items: center;
        background: #fbfbfa;
        color: #111;
        font-family: ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
        padding: 24px;
      }
      main { max-width: 520px; }
      .kicker { color: #8a8a8a; font-family: ui-monospace, SFMono-Regular, Menlo, monospace; font-size: 10px; letter-spacing: .12em; text-transform: uppercase; }
      h1 { margin: 10px 0 12px; font-size: clamp(36px, 8vw, 56px); letter-spacing: -.05em; line-height: 1; }
      p { color: #6d6d6d; line-height: 1.6; }
      a { display: inline-flex; margin-top: 18px; min-height: 44px; align-items: center; border-radius: 6px; background: #111; color: #fff; padding: 0 18px; text-decoration: none; font-size: 13px; }
    </style>
  </head>
  <body>
    <main>
      <div class="kicker">404 / Off the map</div>
      <h1>That page isn’t here.</h1>
      <p>The OmniRun site is a single-page app. Use the link below to get back to the preflight console.</p>
      <a id="home" href="/omnirun/">Back to OmniRun</a>
    </main>
    <script>
      (() => {
        const parts = window.location.pathname.split("/").filter(Boolean);
        const base = parts.length ? `/${parts[0]}/` : "/";
        document.getElementById("home").href = base;
      })();
    </script>
  </body>
</html>
